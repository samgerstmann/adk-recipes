[project]
name = "fsi-doc-intake"
version = "0.1.0"
description = "Document package intake skill: split, extract source-linked fields with confidence, consistency checks, human review and approval."
requires-python = ">=3.11"
license = {text = "Apache-2.0"}

dependencies = [
    "google-adk>=2.2.0",  # agent runtime for `adk web` / `adk run`
    "google-genai>=1.0",  # split + extraction with JSON response schemas
    "pypdf>=4.0",  # page count, page slicing, quote verification
    "python-dotenv>=1.0",
    "pyyaml>=6.0",  # setup.py reads the design-spec frontmatter
]

[project.optional-dependencies]
# Full setup only: Firestore state, gs:// documents, BigQuery / GCS output.
gcp = [
    "google-cloud-firestore>=2.21.0",
    "google-cloud-storage>=2.18.0",
    "google-cloud-bigquery>=3.25.0",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[[tool.uv.index]]
url = "https://pypi.org/simple/"
default = true

[tool.hatch.build.targets.wheel]
packages = ["scripts"]

[dependency-groups]
dev = ["pytest>=8.0", "pytest-asyncio>=0.24"]

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"
